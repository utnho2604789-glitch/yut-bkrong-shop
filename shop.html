<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y UT BKRONG — SHOP</title><style>body{margin:0;background:#05050c;color:#fff;font:15px Arial}main{max-width:1000px;margin:auto;padding:20px}.card{margin:16px 0;padding:20px;border:1px solid #ffffff18;border-radius:20px;background:#ffffff08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product,.stat{padding:18px;border:1px solid #ffffff14;border-radius:16px;background:#0003}button{padding:10px 14px;border:0;border-radius:10px;background:#7c3aed;color:#fff;cursor:pointer}.input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;background:#111;color:#fff;border:1px solid #ffffff20;border-radius:10px}.muted{color:#9ca3af}.modal{display:none;position:fixed;inset:0;background:#000c;place-items:center;padding:15px}.modal.show{display:grid}.box{width:min(500px,100%);background:#0d0d17;padding:20px;border-radius:20px;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px}.price,.balance{font-size:22px;font-weight:bold;color:#67e8f9}.code{color:#67e8f9;font-weight:bold;word-break:break-all}.qr{width:230px;display:block;margin:auto;background:#fff;padding:5px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:10px}.hide{display:none!important}a{color:#67e8f9}</style></head><body><main><header class="card top"><b>Y UT BKRONG // SHOP</b><div><button onclick="openAuth()">Tài khoản</button><a href="/admin" style="margin-left:8px">Admin</a></div></header><section class="card"><h1>SHOP</h1><p class="muted">Đăng ký tài khoản để nạp tiền, mua hàng và nhận nội dung đơn hàng.</p><div id="account"></div></section><section class="card"><h2>SẢN PHẨM</h2><div id="products" class="grid"></div></section><section class="card"><h2>VÍ TIỀN</h2><div class="balance" id="balance">0đ</div><p><button onclick="topup()">Nạp từ 10.000đ</button><button onclick="loadTx()">Lịch sử</button></p><div id="tx"></div></section><section class="card"><h2>ĐƠN HÀNG & NỘI DUNG</h2><div id="orders"></div></section></main><div id="auth" class="modal"><div class="box"><div class="row"><h2>Tài khoản</h2><button onclick="closeM('auth')">X</button></div><input id="name" class="input" placeholder="Tên"/><input id="email" class="input" placeholder="Email"/><input id="pass" class="input" type="password" placeholder="Mật khẩu 6+ ký tự"/><button onclick="register()">Đăng ký</button> <button onclick="login()">Đăng nhập</button></div></div><div id="pay" class="modal"><div class="box"><h2>Nạp tiền</h2><input id="amount" class="input" type="number" min="10000" placeholder="Số tiền, tối thiểu 10.000đ"><button onclick="createTopup()">Tạo giao dịch</button><div id="payment"></div></div></div><script>
let token=localStorage.getItem('shop_token');const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body==='object'&&!(opt.body instanceof FormData)){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Lỗi');return d}function openAuth(){$('auth').classList.add('show')}function closeM(id){$(id).classList.remove('show')}async function register(){try{let d=await api('/api/register',{method:'POST',body:{name:$('name').value,email:$('email').value,password:$('pass').value}});token=d.token;localStorage.setItem('shop_token',token);closeM('auth');render()}catch(e){alert(e.message)}}async function login(){try{let d=await api('/api/login',{method:'POST',body:{email:$('email').value,password:$('pass').value}});token=d.token;localStorage.setItem('shop_token',token);closeM('auth');render()}catch(e){alert(e.message)}}async function render(){let p=await api('/api/products');$('products').innerHTML=p.products.map(x=>`<div class="product"><h3>${x.name}</h3><div class="price">${money(x.price)}</div><p class="muted">${x.description||''}</p><button onclick="buy(${x.id})">Mua</button></div>`).join('');if(token){try{let m=await api('/api/me');$('account').innerHTML=`<b>${m.user.name}</b> · ${m.user.email} <button onclick="logout()">Đăng xuất</button>`;$('balance').textContent=money(m.user.balance);loadOrders()}catch{logout()}}else $('account').innerHTML='<button onclick="openAuth()">Đăng ký / Đăng nhập</button>'}function logout(){token=null;localStorage.removeItem('shop_token');render()}async function buy(id){try{await api('/api/purchases',{method:'POST',body:{productId:id,quantity:1}});alert('Mua thành công');render()}catch(e){alert(e.message)}}function topup(){if(!token)return openAuth();$('pay').classList.add('show');$('payment').innerHTML=''}async function createTopup(){try{let d=await api('/api/topups',{method:'POST',body:{amount:Number($('amount').value)}});$('payment').innerHTML=`<p>Chuyển đúng ${money(d.amount)}</p><img class="qr" src="${d.qr}"><p>Ngân hàng: <b>${d.bank.bank}</b><br>STK: <b>${d.bank.account_number}</b><br>Chủ TK: <b>${d.bank.owner}</b></p><p>Nội dung:</p><div class="code">${d.code}</div><p class="muted">Sau khi chuyển khoản, giao dịch chờ Admin kiểm tra.</p>`;loadTx()}catch(e){alert(e.message)}}async function loadTx(){if(!token)return;let d=await api('/api/my-transactions');$('tx').innerHTML=d.transactions.map(x=>`<p>${x.code||x.id} — ${money(x.amount)} — ${x.status}</p>`).join('')||'<p class="muted">Chưa có giao dịch</p>'}async function loadOrders(){let d=await api('/api/orders');$('orders').innerHTML=d.orders.map(x=>`<div class="product"><b>#${x.id} ${x.product_name}</b><p>${x.quantity} sản phẩm · ${money(x.total)} · ${x.status}</p><button onclick="delivery(${x.id})">Xem nội dung</button><div id="d${x.id}"></div></div>`).join('')||'<p class="muted">Chưa có đơn</p>'}async function delivery(id){let d=await api('/api/orders/'+id+'/delivery');$('d'+id).innerHTML=d.items.map(x=>`<div class="card">${x.text?'<p>'+x.text+'</p>':''}${x.file_url?'<a href="'+x.file_url+'" target="_blank">Mở file: '+(x.file_name||'file')+'</a>':''}</div>`).join('')||'<p class="muted">Chưa có nội dung được giao.</p>'}render();
</script></body></html>
