<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y UT BKRONG — ADMIN</title><style>body{margin:0;background:#05050c;color:#fff;font:14px Arial}main{max-width:1100px;margin:auto;padding:20px}.card{margin:16px 0;padding:20px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.input{width:100%;padding:11px;margin:5px 0;box-sizing:border-box;background:#111;color:#fff;border:1px solid #ffffff20;border-radius:9px}button{padding:9px 12px;border:0;border-radius:9px;background:#7c3aed;color:#fff;cursor:pointer}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #ffffff12;text-align:left}.muted{color:#9ca3af}.hide{display:none}.danger{background:#b91c1c}</style></head><body><main><div class="card"><h1>⚙ ADMIN DASHBOARD</h1><a href="/" style="color:#67e8f9">← Shop</a></div><section id="login" class="card"><h2>Admin đăng nhập</h2><input id="user" class="input" placeholder="Tài khoản"><input id="pass" class="input" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button></section><div id="panel" class="hide"><section class="card"><h2>Sản phẩm</h2><input id="pn" class="input" placeholder="Tên"><input id="pp" class="input" type="number" placeholder="Giá"><input id="pd" class="input" placeholder="Mô tả"><button onclick="addProduct()">Thêm sản phẩm</button><div id="products"></div></section><section class="card"><h2>Nạp tiền chờ duyệt</h2><div id="topups"></div></section><section class="card"><h2>Đơn hàng — giao nội dung/file</h2><div id="orders"></div></section><section class="card"><h2>Ngân hàng / QR</h2><input id="bank" class="input" placeholder="Ngân hàng"><input id="owner" class="input" placeholder="Chủ TK"><input id="num" class="input" placeholder="Số TK"><input id="qr" class="input" placeholder="URL QR (tùy chọn)"><button onclick="saveBank()">Lưu</button></section></div></main><script>let token=localStorage.getItem('admin_token');const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};if(o.body&&typeof o.body==='object'&&!(o.body instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Lỗi');return d}async function login(){try{let d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});let x=await d.json();if(!d.ok)throw Error(x.error);token=x.token;localStorage.setItem('admin_token',token);$('login').classList.add('hide');$('panel').classList.remove('hide');load()}catch(e){alert(e.message)}}async function load(){let d=await api('/api/admin/overview');$('products').innerHTML=d.products.map(p=>`<p>${p.name} — ${p.price}đ <button class="danger" onclick="del(${p.id})">Ẩn</button></p>`).join('');$('topups').innerHTML=d.transactions.filter(t=>t.type==='topup'&&t.status==='pending').map(t=>`<p>${t.code} — ${t.email} — ${t.amount}đ <button onclick="approve(${t.id})">Duyệt</button> <button class="danger" onclick="reject(${t.id})">Từ chối</button></p>`).join('')||'<p class="muted">Không có giao dịch chờ.</p>';$('orders').innerHTML=d.orders.map(o=>`<div class="card"><b>#${o.id} ${o.product_name}</b> — ${o.email} — ${o.total}đ — ${o.status}<form onsubmit="sendDelivery(event,${o.id})"><textarea name="text" class="input" placeholder="Nội dung gửi khách"></textarea><input name="file" type="file"><button>Gửi nội dung</button></form></div>`).join('')||'<p>Chưa có đơn.</p>';$('bank').value=d.bank.bank;$('owner').value=d.bank.owner;$('num').value=d.bank.account_number;$('qr').value=d.bank.qr_url||''}async function addProduct(){try{await api('/api/admin/products',{method:'POST',body:{name:$('pn').value,price:Number($('pp').value),description:$('pd').value}});load()}catch(e){alert(e.message)}}async function del(id){await api('/api/admin/products/'+id,{method:'DELETE'});load()}async function approve(id){await api('/api/admin/topups/'+id+'/approve',{method:'POST'});load()}async function reject(id){await api('/api/admin/topups/'+id+'/reject',{method:'POST'});load()}async function sendDelivery(e,id){e.preventDefault();let f=new FormData(e.target);try{await fetch('/api/admin/orders/'+id+'/delivery',{method:'POST',headers:{Authorization:'Bearer '+token},body:f});load()}catch(e){alert('Không gửi được')}}async function saveBank(){await api('/api/admin/bank',{method:'PUT',body:{bank:$('bank').value,owner:$('owner').value,account_number:$('num').value,qr_url:$('qr').value}});alert('Đã lưu')}if(token){$('login').classList.add('hide');$('panel').classList.remove('hide');load()}</script></body></html>
